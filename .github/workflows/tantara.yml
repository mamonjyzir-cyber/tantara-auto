name: Fangalana boky frantsay isaky ny ora

on:
  schedule:
    - cron: "0 * * * *"   # isaky ny ora (UTC), minitra 0
  workflow_dispatch:       # azo atao an-tsoratra

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python script.py

      - uses: actions/upload-artifact@v4
        with:
          name: donnee
          retention-days: 7
          if-no-files-found: warn
          path: livres/
