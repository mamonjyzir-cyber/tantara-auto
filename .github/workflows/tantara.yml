name: Fangalana boky frantsay

on:
  schedule:
    - cron: "0 3 * * *"   # isan'andro 03:00 UTC = 06:00 eto Antananarivo
  workflow_dispatch:       # azo atao an-tsoratra

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340   # 5 ora 40 minitra, ambany ny fetra 6 ora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - run: python script.py

      - uses: actions/upload-artifact@v4
        with:
          name: donnee
          retention-days: 2
          if-no-files-found: warn
          path: livres/
