name: Fangalana boky malaza isan'andro

on:
  schedule:
    - cron: "0 5 * * *"   # isan'andro 05:00 UTC = 08:00 eto Antananarivo
  workflow_dispatch:       # azo atao an-tsoratra

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas
      - run: python script.py
      - uses: actions/upload-artifact@v4
        with:
          name: donnee
          path: |
            *.csv
            livres/
